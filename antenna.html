<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antenna Topic — Field Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="rf-bg" id="rf-bg"></div>

<nav id="site-nav"></nav>

<div id="page-root">
  <div class="wrap" style="padding-top:32px;">
    <p class="fine mono">Loading topic…</p>
  </div>
</div>

<footer id="site-footer"></footer>

<script src="../common.js"></script>
<script src="data.js"></script>
<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("type");
  const topic = ANTENNA_TOPICS[slug];
  const root = document.getElementById("page-root");

  if (!topic) {
    root.innerHTML = `
      <div class="wrap" style="padding:60px 0;">
        <h1>Topic not found</h1>
        <p style="color:var(--ink-dim);margin-top:10px;">No antenna topic matches "${slug || ''}".</p>
        <a class="btn solid" style="margin-top:20px;display:inline-block;" href="../everyday.html">← Back to Antennas Around You</a>
      </div>`;
    return;
  }

  document.title = topic.name + " — Field Notes";

  const RECON_LABELS = { yagi_uda:"Yagi-Uda" };

  root.innerHTML = `
    <div class="topic-hero">
      <div class="wrap">
        <a class="topic-back" href="../everyday.html">← All antenna topics</a>
        <div class="kicker mono">YOUR INTEREST · ANTENNA TOPIC</div>
        <h1>${topic.name}</h1>
        <p class="tagline">${topic.tagline}</p>
        <div class="stat-row">
          ${topic.stats.map(s => `<div class="stat-chip">${s.label}: <b>${s.value}</b></div>`).join("")}
        </div>
      </div>
    </div>

    <section>
      <div class="wrap">
        <div class="section-head"><div class="kicker mono">Overview</div><h2>What it is, and why it's used.</h2></div>
        <div class="theory-block">${topic.overview}</div>
      </div>
    </section>

    <section>
      <div class="wrap">
        <div class="section-head"><div class="kicker mono">Structure</div><h2>The major components — hover to trace each one.</h2></div>
        <div class="structure-interactive">
          <div class="structure-diagram" id="structure-diagram"></div>
          <div class="structure-grid" id="structure-list">
            ${topic.structure.map(s => `<div class="structure-card" data-part="${s.id}"><h4>${s.title}</h4><p>${s.desc}</p></div>`).join("")}
          </div>
        </div>
      </div>
    </section>

    <section>
      <div class="wrap">
        <div class="section-head"><div class="kicker mono">Working Principle</div><h2>How it actually radiates.</h2></div>
        <div class="theory-block">${topic.working}</div>
      </div>
    </section>

    <section>
      <div class="wrap">
        <div class="section-head"><div class="kicker mono">Radiation Pattern</div><h2>A conceptual look at where the energy goes.</h2></div>
        <div class="pattern-row">
          <div class="pattern-diagram" id="pattern-diagram"></div>
          <div class="pattern-note">
            <span class="stamp" style="position:static;display:inline-block;margin-bottom:12px;">CONCEPTUAL — NOT SIMULATION DATA</span>
            <p>${topic.radiation.note}.</p>
          </div>
        </div>
      </div>
    </section>

    <section>
      <div class="wrap">
        <div class="section-head"><div class="kicker mono">Characteristics</div><h2>What to expect, at a glance.</h2></div>
        <div class="characteristics-grid">
          ${topic.characteristics.map(c => `<div class="characteristic-pill"><span class="label">${c.label.toUpperCase()}</span><span class="value">${c.value}</span></div>`).join("")}
        </div>
      </div>
    </section>

    <section>
      <div class="wrap">
        <div class="section-head"><div class="kicker mono">Applications</div><h2>Where you'll actually find one.</h2></div>
        <div class="app-grid">
          ${topic.applications.map(a => `<div class="app-card"><h4>${a.title}</h4><p>${a.desc}</p></div>`).join("")}
        </div>
      </div>
    </section>

    <section>
      <div class="wrap">
        <div class="section-head"><div class="kicker mono">Can It Be Reconfigured?</div><h2>Where this connects to the actual project.</h2></div>
        <div class="recon-answer ${topic.reconfigurable.possible ? 'yes' : 'no'}">
          <span class="recon-flag">${topic.reconfigurable.possible ? '◆ RECONFIGURABLE' : '◇ TYPICALLY FIXED'}</span>
          <p>${topic.reconfigurable.text}</p>
        </div>
      </div>
    </section>

    <section>
      <div class="wrap">
        <div class="section-head"><div class="kicker mono">Field Notes</div><h2>A couple of things worth knowing.</h2></div>
        <div class="facts-row">
          ${topic.facts.map(f => `<div class="fact-card"><span class="tag">FACT</span>${f}</div>`).join("")}
        </div>
      </div>
    </section>

    ${(topic.related && topic.related.length) ? `
    <section>
      <div class="wrap">
        <div class="section-head"><div class="kicker mono">Related Antennas</div><h2>Keep exploring.</h2></div>
        <div class="related-grid">
          ${topic.related.map(r => ANTENNA_TOPICS[r] ? `
            <a class="nav-card" href="antenna.html?type=${r}">
              <div class="tag">TOPIC</div>
              <h3>${ANTENNA_TOPICS[r].name} <span class="card-arrow">→</span></h3>
              <p>${ANTENNA_TOPICS[r].tagline}</p>
            </a>` : '').join("")}
        </div>
      </div>
    </section>` : ''}

    <section>
      <div class="wrap" style="text-align:center;padding:20px 0 8px;">
        <a class="btn" href="../everyday.html">← Back to Antennas Around You</a>
      </div>
    </section>
  `;

  renderBackground(topic.bg);
  renderStructureDiagram(topic.structure);
  renderPatternDiagram(topic.radiation.type);
  wireStructureHover();

  function renderBackground(type){
    const bg = document.getElementById("rf-bg");
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) { bg.style.display = "none"; return; }

    if (type === "field") {
      // expanding rectangular field pattern — patch / PIFA
      bg.innerHTML = `<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
        <g transform="translate(400,300)">
          ${[0,1,2,3].map(i => `<rect class="rf-field-ring" x="${-70-i*55}" y="${-50-i*40}" width="${140+i*110}" height="${100+i*80}" rx="6"/>`).join("")}
        </g>
      </svg>`;
    } else if (type === "symmetric") {
      // symmetric oscillating waves — dipole / loop
      bg.innerHTML = `<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
        <g transform="translate(400,300)">
          <circle class="rf-ring" r="260"/><circle class="rf-ring" r="260"/>
          <circle class="rf-ring rf-ring-b" r="260"/><circle class="rf-ring rf-ring-b" r="260"/>
        </g>
      </svg>`;
    } else if (type === "spiral") {
      // rotating spiral — helical
      bg.innerHTML = `<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
        <g class="rf-spiral" transform="translate(400,300)">
          <path d="M0,0 C40,-10 40,-50 0,-60 C-60,-72 -60,-140 0,-160 C80,-182 80,-260 0,-280"
                fill="none" stroke="#63C7DE" stroke-width="1.4" opacity="0.5"/>
          <path d="M0,0 C-40,10 -40,50 0,60 C60,72 60,140 0,160 C-80,182 -80,260 0,280"
                fill="none" stroke="#C97C4A" stroke-width="1.4" opacity="0.4"/>
        </g>
      </svg>`;
    } else if (type === "converging") {
      // converging/diverging rays — parabolic
      bg.innerHTML = `<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
        <g transform="translate(400,300)">
          ${[-120,-70,-20,20,70,120].map(y => `<line class="rf-converge" x1="-380" y1="${y*2.1}" x2="0" y2="0" />`).join("")}
        </g>
      </svg>`;
    } else if (type === "multi") {
      // multiple synchronized sources — array
      bg.innerHTML = `<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
        ${[150,320,490,660].map((x,i) => `
          <g transform="translate(${x},430)">
            <circle class="rf-ring rf-ring-multi" r="150" style="animation-delay:${i*0.4}s"/>
            <circle class="rf-ring rf-ring-multi" r="150" style="animation-delay:${i*0.4+1.1}s"/>
          </g>`).join("")}
      </svg>`;
    } else if (type === "sweep") {
      bg.innerHTML = `<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
        <g transform="translate(400,300)">
          <circle r="260" fill="none" stroke="#1F3350" stroke-width="1"/>
          <circle r="180" fill="none" stroke="#1F3350" stroke-width="1"/>
          <circle r="100" fill="none" stroke="#1F3350" stroke-width="1"/>
          <g class="rf-sweep">
            <path d="M0,0 L260,0 A260,260 0 0,0 184,-184 Z" fill="#63C7DE" opacity="0.18"/>
          </g>
        </g>
      </svg>`;
    } else {
      // "directional" default — travelling wavefronts moving one way (yagi)
      bg.innerHTML = `<svg viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
        <line x1="0" y1="150" x2="800" y2="150" stroke="#1F3350" stroke-width="1"/>
        <line x1="0" y1="300" x2="800" y2="300" stroke="#1F3350" stroke-width="1"/>
        <line x1="0" y1="450" x2="800" y2="450" stroke="#1F3350" stroke-width="1"/>
        <circle class="rf-pulse" cx="0" cy="150" r="6" fill="#C97C4A"/>
        <circle class="rf-pulse" cx="0" cy="150" r="6" fill="#C97C4A"/>
        <circle class="rf-pulse" cx="0" cy="300" r="6" fill="#63C7DE"/>
        <circle class="rf-pulse" cx="0" cy="300" r="6" fill="#63C7DE"/>
        <circle class="rf-pulse" cx="0" cy="450" r="6" fill="#C97C4A"/>
        <circle class="rf-pulse" cx="0" cy="450" r="6" fill="#C97C4A"/>
      </svg>`;
    }
  }

  // Generic, reusable structure diagram: lays out N components evenly
  // around a small schematic core so every antenna gets the same
  // interactive treatment without hand-drawn per-type art.
  function renderStructureDiagram(parts){
    const el = document.getElementById("structure-diagram");
    const n = parts.length;
    const cx = 150, cy = 150, r = 96;
    const nodes = parts.map((p, i) => {
      const angle = (-90 + (360 / n) * i) * Math.PI / 180;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      return { ...p, x, y };
    });
    const lines = nodes.map(p => `<line x1="${cx}" y1="${cy}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="#1F3350" stroke-width="1.5"/>`).join("");
    const dots = nodes.map(p => `
      <g class="struct-node" data-part="${p.id}">
        <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="22" fill="#0F1A2C" stroke="#1F3350" stroke-width="1.5" class="struct-halo"/>
        <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="7" fill="#C97C4A" class="struct-dot"/>
      </g>`).join("");
    el.innerHTML = `<svg viewBox="0 0 300 300" width="100%">
      ${lines}
      <circle cx="${cx}" cy="${cy}" r="26" fill="#16263D" stroke="#3E5C82" stroke-width="1.5"/>
      <circle cx="${cx}" cy="${cy}" r="4" fill="#63C7DE"/>
      ${dots}
    </svg>`;
  }

  function wireStructureHover(){
    const nodes = document.querySelectorAll('.struct-node');
    const cards = document.querySelectorAll('.structure-card');
    function setActive(part){
      nodes.forEach(n => n.classList.toggle('active', n.dataset.part === part));
      cards.forEach(c => c.classList.toggle('active', c.dataset.part === part));
    }
    nodes.forEach(n => {
      n.addEventListener('mouseenter', () => setActive(n.dataset.part));
      n.addEventListener('mouseleave', () => setActive(null));
      n.addEventListener('focus', () => setActive(n.dataset.part));
    });
    cards.forEach(c => {
      c.addEventListener('mouseenter', () => setActive(c.dataset.part));
      c.addEventListener('mouseleave', () => setActive(null));
    });
  }

  // Reusable conceptual polar-pattern generator, driven by `type`.
  function renderPatternDiagram(type){
    const el = document.getElementById("pattern-diagram");
    const cx = 130, cy = 130;
    const pts = [];
    const N = 120;
    for (let i = 0; i <= N; i++){
      const theta = (i / N) * 2 * Math.PI;
      let rr;
      if (type === "omni") rr = 95;
      else if (type === "figure8") rr = 95 * Math.abs(Math.sin(theta));
      else if (type === "broadside") rr = 95 * Math.pow(Math.max(0, Math.cos(theta)), 0.6);
      else if (type === "axial") rr = 95 * Math.pow(Math.max(0, Math.cos(theta)), 4);
      else if (type === "converge") rr = 95 * Math.pow(Math.max(0, Math.cos(theta)), 8);
      else if (type === "multilobe") rr = 95 * Math.abs(Math.cos(theta)) * (0.55 + 0.45 * Math.abs(Math.cos(3 * theta)));
      else /* lobe */ rr = 95 * Math.pow(Math.max(0, (1 + Math.cos(theta)) / 2), 1.6) + 6 * Math.pow(Math.max(0, -Math.cos(theta)), 3);
      const x = cx + rr * Math.sin(theta);
      const y = cy - rr * Math.cos(theta);
      pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
    }
    el.innerHTML = `<svg viewBox="0 0 260 260" width="100%">
      <circle cx="${cx}" cy="${cy}" r="95" fill="none" stroke="#1F3350" stroke-width="1"/>
      <circle cx="${cx}" cy="${cy}" r="63" fill="none" stroke="#1F3350" stroke-width="1" stroke-dasharray="2 3"/>
      <circle cx="${cx}" cy="${cy}" r="31" fill="none" stroke="#1F3350" stroke-width="1" stroke-dasharray="2 3"/>
      <line x1="${cx}" y1="${cy-95}" x2="${cx}" y2="${cy+95}" stroke="#1F3350" stroke-width="1"/>
      <line x1="${cx-95}" y1="${cy}" x2="${cx+95}" y2="${cy}" stroke="#1F3350" stroke-width="1"/>
      <polygon points="${pts.join(' ')}" fill="rgba(99,199,222,0.16)" stroke="#63C7DE" stroke-width="2" class="pattern-poly"/>
      <circle cx="${cx}" cy="${cy}" r="3.5" fill="#E39A66"/>
    </svg>`;
  }
})();
</script>

</body>
</html>
