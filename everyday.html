<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antennas Around You — Field Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav id="site-nav"></nav>

<div class="page-header">
  <div class="wrap">
    <div class="kicker mono">Everyday RF</div>
    <h1>Antennas Around You</h1>
    <p>You're within a few feet of at least five different antenna types right now. Here's what's actually doing the work.</p>
  </div>
</div>

<section>
  <div class="wrap" id="everyday-root"></div>
</section>

<footer id="site-footer"></footer>

<script src="common.js"></script>
<script>
/* ============================================================
   EDIT ME: to add a new antenna example, copy one object below
   (inside the matching group's "items" array) and change the text.
   No HTML/CSS knowledge needed — icon, found_in, and description
   are the only fields that show up on the page.
   ============================================================ */
const EVERYDAY_GROUPS = [
  {
    title: "In your pocket",
    sub: "The antennas closest to your body, all day long.",
    items: [
      {
        icon: "phone",
        found_in: "Smartphone",
        title: "PIFA (Planar Inverted-F Antenna)",
        desc: "Folded into the phone's metal frame or mounted on a small internal carrier, a PIFA gives good bandwidth in a tiny footprint — the standard choice for cellular and Wi-Fi antennas inside modern phones."
      },
      {
        icon: "earbud",
        found_in: "Bluetooth earbuds",
        title: "IFA, PIFA, or chip antenna",
        desc: "Space inside an earbud is measured in millimeters, so designers pick whichever of these three fits — a bent wire (IFA), a grounded plate (PIFA), or a tiny ceramic chip antenna — to cover the 2.4 GHz Bluetooth band."
      },
      {
        icon: "watch",
        found_in: "Smartwatch",
        title: "Loop antenna",
        desc: "Wrapped around the edge of the watch face or case, a small loop antenna handles Bluetooth and Wi-Fi in a shape that survives being strapped to a wrist all day."
      }
    ]
  },
  {
    title: "In your home",
    sub: "Antennas hiding in plain sight on your furniture.",
    items: [
      {
        icon: "router",
        found_in: "Wi-Fi router",
        title: "Monopole or dipole antenna",
        desc: "Those external sticks on a router are simple monopole or dipole antennas — cheap, easy to tune, and good at radiating fairly evenly in every direction across the room.",
        topic: "dipole"
      },
      {
        icon: "tv",
        found_in: "TV reception",
        title: "Dipole / Yagi-Uda antenna",
        desc: "Rooftop and indoor TV antennas are usually Yagi-Uda designs — a driven dipole plus extra parasitic elements that add directional gain, pointing toward the broadcast tower for a cleaner signal.",
        topic: "yagi-uda"
      }
    ]
  },
  {
    title: "On the move",
    sub: "What's mounted on and inside your car.",
    items: [
      {
        icon: "gps",
        found_in: "Car GPS",
        title: "Microstrip patch antenna",
        desc: "GPS needs to receive circularly polarized signals from satellites overhead, and a small circularly-polarized patch antenna tucked under the dashboard or in the roof module does exactly that.",
        topic: "patch"
      },
      {
        icon: "car-roof",
        found_in: "Car roof (shark-fin)",
        title: "Multiband / patch antenna array",
        desc: "That shark-fin bump on a car roof usually hides several antennas at once — GPS, cellular, and radio — often built as stacked or multiband patch elements sharing one housing.",
        topic: "patch"
      }
    ]
  },
  {
    title: "In the network",
    sub: "Infrastructure you don't own, but rely on constantly.",
    items: [
      {
        icon: "tower",
        found_in: "Cell tower",
        title: "Sector patch antenna arrays",
        desc: "Those rectangular panels on a cell tower are arrays of patch antennas, each panel covering a 60–120° sector — three panels typically cover all 360° around the tower.",
        topic: "array"
      },
      {
        icon: "dish",
        found_in: "Satellite communication",
        title: "Parabolic reflector (satellite dish)",
        desc: "A satellite dish isn't the antenna itself — it's a reflector that focuses incoming signal onto a small feed antenna at its focal point, giving huge effective gain from a passive curved surface.",
        topic: "parabolic"
      }
    ]
  }
];

const ICONS = {
  phone: `<svg viewBox="0 0 48 48" fill="none"><rect x="14" y="4" width="20" height="40" rx="3" stroke="#C97C4A" stroke-width="2"/><line x1="20" y1="10" x2="28" y2="10" stroke="#63C7DE" stroke-width="2"/><circle cx="24" cy="38" r="1.6" fill="#63C7DE"/></svg>`,
  earbud: `<svg viewBox="0 0 48 48" fill="none"><ellipse cx="20" cy="24" rx="9" ry="12" stroke="#C97C4A" stroke-width="2"/><path d="M27 18 C36 16 38 30 30 34" stroke="#63C7DE" stroke-width="2" fill="none"/></svg>`,
  watch: `<svg viewBox="0 0 48 48" fill="none"><rect x="14" y="14" width="20" height="20" rx="4" stroke="#C97C4A" stroke-width="2"/><rect x="19" y="6" width="10" height="8" rx="2" stroke="#8FA3BE" stroke-width="1.5"/><rect x="19" y="34" width="10" height="8" rx="2" stroke="#8FA3BE" stroke-width="1.5"/><circle cx="24" cy="24" r="4" stroke="#63C7DE" stroke-width="1.8"/></svg>`,
  router: `<svg viewBox="0 0 48 48" fill="none"><rect x="8" y="28" width="32" height="10" rx="2" stroke="#C97C4A" stroke-width="2"/><line x1="16" y1="28" x2="12" y2="8" stroke="#63C7DE" stroke-width="2"/><line x1="32" y1="28" x2="36" y2="8" stroke="#63C7DE" stroke-width="2"/></svg>`,
  tv: `<svg viewBox="0 0 48 48" fill="none"><line x1="24" y1="40" x2="24" y2="22" stroke="#8FA3BE" stroke-width="2"/><line x1="24" y1="22" x2="8" y2="10" stroke="#C97C4A" stroke-width="2"/><line x1="12" y1="16" x2="18" y2="20" stroke="#C97C4A" stroke-width="2"/><line x1="16" y1="12" x2="22" y2="17" stroke="#C97C4A" stroke-width="2"/><circle cx="24" cy="22" r="2" fill="#63C7DE"/></svg>`,
  gps: `<svg viewBox="0 0 48 48" fill="none"><rect x="12" y="16" width="24" height="16" rx="2" stroke="#1F3350" stroke-width="2"/><rect x="17" y="20" width="14" height="8" fill="#C97C4A" opacity="0.85"/><circle cx="24" cy="38" r="1.8" fill="#63C7DE"/></svg>`,
  "car-roof": `<svg viewBox="0 0 48 48" fill="none"><path d="M8 34 C8 24 16 16 24 16 C32 16 40 24 40 34" stroke="#8FA3BE" stroke-width="2" fill="none"/><path d="M16 34 C18 26 22 22 24 22 C26 22 30 26 32 34" fill="#C97C4A" opacity="0.85" stroke="none"/><line x1="8" y1="34" x2="40" y2="34" stroke="#8FA3BE" stroke-width="2"/></svg>`,
  tower: `<svg viewBox="0 0 48 48" fill="none"><line x1="24" y1="44" x2="24" y2="6" stroke="#8FA3BE" stroke-width="2"/><rect x="14" y="12" width="6" height="14" fill="#C97C4A" opacity="0.85"/><rect x="28" y="12" width="6" height="14" fill="#C97C4A" opacity="0.85"/><line x1="8" y1="44" x2="40" y2="44" stroke="#8FA3BE" stroke-width="2"/></svg>`,
  dish: `<svg viewBox="0 0 48 48" fill="none"><path d="M6 30 C6 16 42 16 42 30" stroke="#C97C4A" stroke-width="2.5" fill="none"/><line x1="24" y1="23" x2="24" y2="10" stroke="#63C7DE" stroke-width="2"/><circle cx="24" cy="10" r="2" fill="#63C7DE"/><line x1="24" y1="30" x2="24" y2="42" stroke="#8FA3BE" stroke-width="2"/></svg>`
};

const TOPIC_LABELS = {
  "yagi-uda": "Yagi-Uda Antenna",
  "patch": "Microstrip Patch Antenna",
  "dipole": "Dipole Antenna",
  "horn": "Horn Antenna",
  "parabolic": "Parabolic Reflector",
  "helical": "Helical Antenna",
  "array": "Antenna Array"
};

const root = document.getElementById("everyday-root");

function itemCard(item){
  const inner = `
    ${ICONS[item.icon] || ""}
    <span class="found-in">FOUND IN: ${item.found_in.toUpperCase()}</span>
    <h4>${item.title}${item.topic ? ' <span class="card-arrow">→</span>' : ''}</h4>
    <p>${item.desc}</p>
  `;
  return item.topic
    ? `<a class="item-card" href="antennas/antenna.html?type=${item.topic}">${inner}</a>`
    : `<div class="item-card">${inner}</div>`;
}

root.innerHTML = EVERYDAY_GROUPS.map(group => `
  <div class="everyday-group">
    <h2>${group.title}</h2>
    <div class="group-sub">${group.sub}</div>
    <div class="everyday-grid">
      ${group.items.map(itemCard).join("")}
    </div>
  </div>
`).join("") + `
  <div class="everyday-group">
    <h2>Browse all antenna topics</h2>
    <div class="group-sub">Deep-dive pages covering structure, working principle, and applications for each type.</div>
    <div class="topics-strip">
      ${Object.keys(TOPIC_LABELS).map(slug => `
        <a class="nav-card" href="antennas/antenna.html?type=${slug}">
          <div class="tag">TOPIC</div>
          <h3>${TOPIC_LABELS[slug]} <span class="card-arrow">→</span></h3>
        </a>
      `).join("")}
    </div>
  </div>
`;
</script>

</body>
</html>
